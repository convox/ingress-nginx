name: release

on:
  push:
    branches-ignore: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+-[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'branch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: login
        run: printf '%s' "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: build
        run: |
          IMAGE="convox/ingress-nginx:${GITHUB_SHA}-${ARCH}"
          if FOUND="$(docker buildx imagetools inspect "${IMAGE}" 2>&1)"; then
            echo "${IMAGE} exists"
            exit 0
          fi
          case "${FOUND}" in
            *"not found"*) ;;
            *) echo "${FOUND}"; exit 1 ;;
          esac
          docker buildx build --platform "linux/${ARCH}" -t "${IMAGE}" --push --pull ./1.15

  create-manifest:
    if: github.ref_type == 'branch'
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: login
        run: printf '%s' "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: create multi-arch manifest
        run: |
          IMAGE="convox/ingress-nginx:${GITHUB_SHA}"
          if FOUND="$(docker buildx imagetools inspect "${IMAGE}" 2>&1)"; then
            echo "${IMAGE} exists"
            exit 0
          fi
          case "${FOUND}" in
            *"not found"*) ;;
            *) echo "${FOUND}"; exit 1 ;;
          esac
          docker buildx imagetools create -t "${IMAGE}" "${IMAGE}-amd64" "${IMAGE}-arm64"

  promote:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: login
        run: printf '%s' "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: promote the commit image
        run: |
          set -euo pipefail
          COMMIT="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${GITHUB_REF_NAME}" "refs/tags/${GITHUB_REF_NAME}^{}" | tail -1 | cut -f1)"
          if [ -z "${COMMIT}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} no longer exists"
            exit 1
          fi
          SOURCE="convox/ingress-nginx:${COMMIT}"
          TARGET="convox/ingress-nginx:${GITHUB_REF_NAME}"
          if FOUND="$(docker buildx imagetools inspect "${TARGET}" 2>&1)"; then
            echo "::error::${TARGET} is already published"
            exit 1
          fi
          case "${FOUND}" in
            *"not found"*) ;;
            *) echo "${FOUND}"; exit 1 ;;
          esac
          if ! WANT="$(docker buildx imagetools inspect --raw "${SOURCE}")"; then
            echo "::error::no image for commit ${COMMIT}, tag the commit that was built and tested"
            exit 1
          fi
          GOT="$(docker buildx imagetools create --dry-run -t "${TARGET}" "${SOURCE}")"
          if [ "${WANT}" != "${GOT}" ]; then
            echo "::error::copying ${SOURCE} to ${TARGET} would change its digest"
            exit 1
          fi
          docker buildx imagetools create -t "${TARGET}" "${SOURCE}"
