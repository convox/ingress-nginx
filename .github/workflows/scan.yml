name: scan

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  trivy:
    runs-on: ubuntu-24.04
    steps:
      - name: newest tag
        run: |
          TAG="$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" | awk -F/ '{print $3}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' | sort -V | tail -1)"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - name: trivy
        run: |
          for arch in amd64 arm64; do
            docker run --rm aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --scanners vuln --severity HIGH,CRITICAL --format table --platform "linux/${arch}" "convox/ingress-nginx:${TAG}"
          done
